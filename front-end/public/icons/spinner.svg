<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="spin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#spin)" stroke-width="3" stroke-dasharray="70 30" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#059669" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>